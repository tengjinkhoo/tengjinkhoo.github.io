<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Recruitment tracker dashboard</title>
  <desc id="desc">Synthetic internship recruitment tracker with role table, completion bars, and an open-positions chart.</desc>
  <rect width="1600" height="900" rx="28" fill="#F7EFE6"/>
  <rect x="28" y="28" width="1544" height="844" rx="26" fill="#FFF9F3" stroke="#E2CBB7"/>

  <rect x="56" y="54" width="1488" height="82" rx="18" fill="#184E85"/>
  <text x="88" y="104" fill="#FFF9F3" font-size="40" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">
    Internship Recruitment Tracker
  </text>
  <rect x="56" y="164" width="320" height="122" rx="20" fill="#F4F8FC" stroke="#D8E4EF"/>
  <text x="84" y="206" fill="#54708A" font-size="22" font-family="Public Sans, Segoe UI, sans-serif" font-weight="600">Open roles</text>
  <text x="84" y="258" fill="#173B58" font-size="54" font-family="Public Sans, Segoe UI, sans-serif" font-weight="800">11</text>

  <rect x="392" y="164" width="320" height="122" rx="20" fill="#F4F8FC" stroke="#D8E4EF"/>
  <text x="420" y="206" fill="#54708A" font-size="22" font-family="Public Sans, Segoe UI, sans-serif" font-weight="600">Positions filled</text>
  <text x="420" y="258" fill="#173B58" font-size="54" font-family="Public Sans, Segoe UI, sans-serif" font-weight="800">29 / 39</text>

  <rect x="728" y="164" width="320" height="122" rx="20" fill="#F4F8FC" stroke="#D8E4EF"/>
  <text x="756" y="206" fill="#54708A" font-size="22" font-family="Public Sans, Segoe UI, sans-serif" font-weight="600">Average completion</text>
  <text x="756" y="258" fill="#173B58" font-size="54" font-family="Public Sans, Segoe UI, sans-serif" font-weight="800">74%</text>

  <rect x="1064" y="164" width="480" height="122" rx="20" fill="#FFF4EA" stroke="#E8D2BC"/>
  <text x="1092" y="206" fill="#7B5A40" font-size="22" font-family="Public Sans, Segoe UI, sans-serif" font-weight="600">Used for</text>
  <text fill="#3A2A1E" font-size="24" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">
    <tspan x="1092" y="242">Tracking demand, filled roles,</tspan>
    <tspan x="1092" y="272">and hiring progress by period</tspan>
  </text>

  <rect x="56" y="316" width="980" height="504" rx="22" fill="#FFFFFF" stroke="#E2CBB7"/>
  <text x="84" y="358" fill="#173B58" font-size="28" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">
