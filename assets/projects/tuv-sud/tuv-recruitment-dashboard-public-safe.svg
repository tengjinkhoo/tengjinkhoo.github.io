  </text>

  <g font-family="Public Sans, Segoe UI, sans-serif">
    <text x="1096" y="460" fill="#6B645D" font-size="16">Data Analyst</text>
    <rect x="1262" y="442" width="214" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="1262" y="442" width="71" height="22" rx="11" fill="#4F9AD7"/>
    <text x="1486" y="458" fill="#173B58" font-size="15" font-weight="700" text-anchor="end">1 open</text>

    <text x="1096" y="515" fill="#6B645D" font-size="16">Chemistry Lab</text>
    <rect x="1262" y="497" width="214" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="1262" y="497" width="71" height="22" rx="11" fill="#5FB7A1"/>
    <text x="1486" y="513" fill="#173B58" font-size="15" font-weight="700" text-anchor="end">1 open</text>

    <text x="1096" y="570" fill="#6B645D" font-size="16">Mechanical Design</text>
    <rect x="1262" y="552" width="214" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="1262" y="552" width="214" height="22" rx="11" fill="#E39B5D"/>
    <text x="1486" y="568" fill="#173B58" font-size="15" font-weight="700" text-anchor="end">3 open</text>

    <text x="1096" y="625" fill="#6B645D" font-size="16">Sustainability</text>
    <rect x="1262" y="607" width="214" height="22" rx="11" fill="#E7EDF3"/>
    <text x="1486" y="623" fill="#173B58" font-size="15" font-weight="700" text-anchor="end">0 open</text>

    <text x="1096" y="680" fill="#6B645D" font-size="16">HR Operations</text>
    <rect x="1262" y="662" width="214" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="1262" y="662" width="214" height="22" rx="11" fill="#4F9AD7"/>
    <text x="1486" y="678" fill="#173B58" font-size="15" font-weight="700" text-anchor="end">3 open</text>

    <text x="1096" y="735" fill="#6B645D" font-size="16">Finance</text>
    <rect x="1262" y="717" width="214" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="1262" y="717" width="143" height="22" rx="11" fill="#5FB7A1"/>
