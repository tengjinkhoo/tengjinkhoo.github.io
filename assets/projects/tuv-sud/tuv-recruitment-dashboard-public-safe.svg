    <text x="692" y="540">4</text>
    <text x="792" y="540">3</text>
    <rect x="874" y="522" width="108" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="874" y="522" width="81" height="22" rx="11" fill="#5FB7A1"/>
    <text x="918" y="539" fill="#FFFFFF" font-size="14" font-weight="700">75%</text>

    <rect x="84" y="570" width="924" height="52" rx="10" fill="#FFF9F4"/>
