  </text>

  <rect x="84" y="382" width="924" height="50" rx="12" fill="#EDF4FA"/>
  <text x="108" y="414" fill="#54708A" font-size="18" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">Position</text>
  <text x="488" y="414" fill="#54708A" font-size="18" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">Period</text>
  <text x="680" y="414" fill="#54708A" font-size="18" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">Needed</text>
  <text x="784" y="414" fill="#54708A" font-size="18" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">Filled</text>
  <text x="874" y="414" fill="#54708A" font-size="18" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">Completion</text>

