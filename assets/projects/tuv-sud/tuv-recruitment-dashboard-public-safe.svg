    <text x="488" y="602">May 2025 - Aug 2025</text>
    <text x="692" y="602">7</text>
    <text x="792" y="602">4</text>
    <rect x="874" y="584" width="108" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="874" y="584" width="62" height="22" rx="11" fill="#E39B5D"/>
    <text x="912" y="601" fill="#FFFFFF" font-size="14" font-weight="700">57%</text>

    <rect x="84" y="632" width="924" height="52" rx="10" fill="#FFFFFF"/>
    <text x="108" y="664">Sustainability Research Intern</text>
    <text x="488" y="664">Jun 2025 - Nov 2025</text>
    <text x="692" y="664">5</text>
    <text x="792" y="664">5</text>
    <rect x="874" y="646" width="108" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="874" y="646" width="108" height="22" rx="11" fill="#3677C8"/>
    <text x="912" y="663" fill="#FFFFFF" font-size="14" font-weight="700">100%</text>

    <rect x="84" y="694" width="924" height="52" rx="10" fill="#FFF9F4"/>
    <text x="108" y="726">HR Operations Intern</text>
    <text x="488" y="726">Jul 2025 - Dec 2025</text>
    <text x="692" y="726">9</text>
    <text x="792" y="726">6</text>
    <rect x="874" y="708" width="108" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="874" y="708" width="72" height="22" rx="11" fill="#4F9AD7"/>
    <text x="914" y="725" fill="#FFFFFF" font-size="14" font-weight="700">67%</text>

    <rect x="84" y="756" width="924" height="52" rx="10" fill="#FFFFFF"/>
    <text x="108" y="788">Finance Intern</text>
    <text x="488" y="788">Aug 2025 - Jan 2026</text>
    <text x="692" y="788">8</text>
    <text x="792" y="788">6</text>
    <rect x="874" y="770" width="108" height="22" rx="11" fill="#E7EDF3"/>
    <rect x="874" y="770" width="81" height="22" rx="11" fill="#5FB7A1"/>
