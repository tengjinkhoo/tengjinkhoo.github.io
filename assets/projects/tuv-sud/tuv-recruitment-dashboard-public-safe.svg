  <rect x="1068" y="316" width="476" height="504" rx="22" fill="#FFFFFF" stroke="#E2CBB7"/>
  <text x="1096" y="358" fill="#173B58" font-size="28" font-family="Public Sans, Segoe UI, sans-serif" font-weight="700">
